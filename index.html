<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>二维高尔夫飞行模拟器</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f7f1;
      --panel: #ffffff;
      --ink: #17241d;
      --muted: #617065;
      --line: #cddbd1;
      --fairway: #2d8b57;
      --fairway-dark: #16623a;
      --sky: #e8f5ff;
      --blue: #2478b7;
      --orange: #d87332;
      --gold: #f0b84a;
      --shadow: 0 18px 44px rgba(30, 56, 39, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(243, 247, 241, 0.94)),
        radial-gradient(circle at 18% 12%, rgba(124, 199, 121, 0.28), transparent 34%),
        radial-gradient(circle at 86% 0%, rgba(36, 120, 183, 0.14), transparent 30%),
        var(--bg);
    }

    .app {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 26px 0 96px;
    }

    header {
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 3vw, 42px);
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 760px;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .layout {
      display: grid;
      grid-template-columns: 328px minmax(0, 1fr);
      gap: 18px;
      align-items: stretch;
    }

    .panel,
    .stage {
      background: rgba(255, 255, 255, 0.93);
      border: 1px solid rgba(205, 219, 209, 0.95);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .panel {
      padding: 18px;
    }

    .control {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
      font-size: 14px;
    }

    select,
    input[type="range"] {
      width: 100%;
    }

    select {
      height: 42px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      font-size: 15px;
    }

    input[type="range"] {
      accent-color: var(--fairway);
    }

    .range-row {
      display: grid;
      grid-template-columns: 1fr 58px;
      gap: 10px;
      align-items: center;
    }

    .value-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #f8faf7;
      font-variant-numeric: tabular-nums;
    }

    .hint {
      margin: -5px 0 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    .stat {
      min-height: 78px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8faf7;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
    }

    .stat strong {
      display: block;
      margin-top: 7px;
      font-size: 21px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .message {
      min-height: 47px;
      margin-top: 14px;
      padding: 11px 12px;
      border: 1px solid rgba(45, 139, 87, 0.24);
      border-radius: 8px;
      background: rgba(45, 139, 87, 0.08);
      color: var(--fairway-dark);
      font-size: 13px;
      line-height: 1.55;
    }

    .message.land {
      border-color: rgba(216, 115, 50, 0.32);
      background: rgba(216, 115, 50, 0.08);
      color: #9b4b17;
    }

    .club-list {
      margin-top: 18px;
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }

    .club-list h2 {
      margin: 0 0 9px;
      font-size: 15px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .chip {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      padding: 6px 9px;
      font-size: 12px;
      color: var(--muted);
    }

    .chip.active {
      border-color: var(--fairway);
      color: #145c36;
      background: #e8f6eb;
      font-weight: 700;
    }

    .stage {
      position: relative;
      min-height: 600px;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 600px;
    }

    .legend {
      position: absolute;
      left: 18px;
      bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
      pointer-events: none;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 9px;
      border: 1px solid rgba(205, 219, 209, 0.9);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.84);
    }

    .swatch {
      width: 14px;
      height: 4px;
      border-radius: 999px;
      background: var(--blue);
    }

    .swatch.orange {
      background: var(--orange);
    }

    .ball-dot {
      width: 10px;
      height: 10px;
      border: 1px solid #c6c6c6;
      border-radius: 50%;
      background:
        radial-gradient(circle at 38% 35%, #fff 0 18%, #e9ece9 19% 56%, #b8c0ba 57% 100%);
      box-shadow: inset -2px -2px 3px rgba(0, 0, 0, 0.12);
    }

    .launch-dock {
      position: fixed;
      right: max(18px, calc((100vw - 1180px) / 2 + 18px));
      bottom: 18px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid rgba(205, 219, 209, 0.9);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 16px 42px rgba(30, 56, 39, 0.18);
      backdrop-filter: blur(8px);
    }

    .launch-button,
    .reset-button {
      height: 46px;
      border: 0;
      border-radius: 8px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.15s ease;
    }

    .launch-button {
      min-width: 128px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 18px;
      color: #fff;
      background: linear-gradient(135deg, var(--fairway), var(--blue));
    }

    .reset-button {
      width: 46px;
      color: var(--muted);
      background: #f5f8f5;
      border: 1px solid var(--line);
    }

    .launch-button:hover,
    .reset-button:hover {
      filter: brightness(1.05);
    }

    .launch-button:active,
    .reset-button:active {
      transform: translateY(1px) scale(0.98);
    }

    .launch-button:disabled {
      cursor: wait;
      filter: grayscale(0.2) brightness(0.92);
    }

    @media (max-width: 850px) {
      .app {
        width: min(100vw - 20px, 680px);
        padding-bottom: 104px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .stage,
      canvas {
        min-height: 470px;
      }

      .launch-dock {
        right: 10px;
        left: 10px;
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>二维高尔夫飞行模拟器</h1>
      <p class="subtitle">选择球员和球杆，调整发射角度，然后点击右下角的发射按钮。小球会先被击出，再沿着飞行轨迹前进，轨迹会跟着飞行过程逐步画出来。</p>
    </header>

    <section class="layout">
      <aside class="panel">
        <div class="control">
          <label for="player">球员力量</label>
          <select id="player"></select>
        </div>

        <div class="control">
          <label for="club">球杆</label>
          <select id="club"></select>
        </div>

        <div class="control">
          <label for="angle">发射角度</label>
          <div class="range-row">
            <input id="angle" type="range" min="7" max="55" step="1" />
            <span class="value-pill" id="angleValue">12°</span>
          </div>
        </div>

        <p class="hint">距离来自你给的表格。程序会根据选中的距离和角度反推出初速度，再用抛体公式播放这次击球。</p>

        <div class="stats">
          <div class="stat">
            <span>目标飞行距离</span>
            <strong id="distanceText">0 yd</strong>
          </div>
          <div class="stat">
            <span>当前飞行距离</span>
            <strong id="liveDistanceText">0 yd</strong>
          </div>
          <div class="stat">
            <span>初速度</span>
            <strong id="speedText">0 m/s</strong>
          </div>
          <div class="stat">
            <span>飞行时间</span>
            <strong id="timeText">0.0 s</strong>
          </div>
        </div>

        <div class="message" id="message">选好球员和球杆后，点击右下角发射。</div>

        <div class="club-list">
          <h2>当前球员可用球杆</h2>
          <div class="chips" id="clubChips"></div>
        </div>
      </aside>

      <section class="stage" aria-label="高尔夫小球二维飞行轨迹">
        <canvas id="trajectoryCanvas"></canvas>
        <div class="legend">
          <span><i class="ball-dot"></i>小球</span>
          <span><i class="swatch"></i>飞行中留下的轨迹</span>
          <span><i class="swatch orange"></i>落地点</span>
        </div>
      </section>
    </section>
  </main>

  <div class="launch-dock">
    <button class="reset-button" id="resetBtn" title="重置">↺</button>
    <button class="launch-button" id="launchBtn">
      <span class="ball-dot" aria-hidden="true"></span>
      发射
    </button>
  </div>

  <script>
    const YARD_TO_METER = 0.9144;
    const METER_TO_YARD = 1 / YARD_TO_METER;
    const G = 9.81;

    const players = {
      "Calvin": [
        ["60°", 70], ["56°", 80], ["52°", 90], ["48°", 110], ["PW", 120],
        ["9 Iron", 130], ["8 Iron", 140], ["7 Iron", 150], ["6 Iron", 160],
        ["5 Iron", 180], ["4 Hybrid", 190], ["3 Wood", 210], ["Driver", 240]
      ],
      "Youtube Golfer": [
        ["60°", 101], ["56°", 125], ["52°", 148], ["PW", 165], ["9 Iron", 174],
        ["8 Iron", 194], ["7 Iron", 207], ["6 Iron", 216], ["5 Iron", 223],
        ["4 Iron", 242], ["3 Iron", 260], ["3 Wood", 312], ["Driver", 324]
      ],
      "Pro (Bryson DeChambeau)": [
        ["60°", 119], ["56°", 144], ["50°", 163], ["45°", 178], ["PW", 186],
        ["9 Iron", 211], ["8 Iron", 215], ["7 Iron", 235], ["6 Iron", 249],
        ["5 Iron", 254], ["5 Wood", 317], ["3 Wood", 328], ["Driver", 352]
      ],
      "Pro (Nelly Korda)": [
        ["58°", 80], ["54°", 98], ["50°", 113], ["PW", 122], ["9 Iron", 134],
        ["8 Iron", 149], ["7 Iron", 159], ["6 Iron", 173], ["5 Iron", 185],
        ["6 Wood", 200], ["3 Wood", 223], ["Driver", 258]
      ]
    };

    const defaultAngles = {
      "60°": 34, "58°": 33, "56°": 32, "54°": 31, "52°": 30, "50°": 28,
      "48°": 27, "45°": 25, "PW": 24, "9 Iron": 22, "8 Iron": 20,
      "7 Iron": 18, "6 Iron": 16, "5 Iron": 14, "4 Iron": 13,
      "3 Iron": 12, "4 Hybrid": 13, "6 Wood": 12, "5 Wood": 11,
      "3 Wood": 10, "Driver": 12
    };

    const playerSelect = document.querySelector("#player");
    const clubSelect = document.querySelector("#club");
    const angleSlider = document.querySelector("#angle");
    const canvas = document.querySelector("#trajectoryCanvas");
    const ctx = canvas.getContext("2d");
    const launchBtn = document.querySelector("#launchBtn");
    const resetBtn = document.querySelector("#resetBtn");

    const fields = {
      angle: document.querySelector("#angleValue"),
      distance: document.querySelector("#distanceText"),
      liveDistance: document.querySelector("#liveDistanceText"),
      speed: document.querySelector("#speedText"),
      time: document.querySelector("#timeText"),
      message: document.querySelector("#message"),
      chips: document.querySelector("#clubChips")
    };

    let shot = null;
    let animation = null;
    let trail = [];
    let ballPosition = { x: 0, y: 0 };
    let landed = false;
    let flightProgress = 0;
    let audioContext = null;

    function fillPlayers() {
      Object.keys(players).forEach((name) => {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        playerSelect.appendChild(option);
      });
    }

    function fillClubs() {
      const clubs = players[playerSelect.value];
      clubSelect.innerHTML = "";
      clubs.forEach(([club, distance]) => {
        const option = document.createElement("option");
        option.value = club;
        option.textContent = `${club} - ${distance} yd`;
        clubSelect.appendChild(option);
      });
      clubSelect.value = clubs.at(-1)[0];
      angleSlider.value = defaultAngles[clubSelect.value] || 18;
      resetShot("选好球员和球杆后，点击右下角发射。");
    }

    function getShot() {
      const player = playerSelect.value;
      const club = clubSelect.value;
      const distanceYards = players[player].find(([name]) => name === club)[1];
      const angleDeg = Number(angleSlider.value);
      const angleRad = angleDeg * Math.PI / 180;
      const distanceMeters = distanceYards * YARD_TO_METER;
      const speed = Math.sqrt(distanceMeters * G / Math.sin(2 * angleRad));
      const duration = distanceMeters / (speed * Math.cos(angleRad));
      const maxHeightMeters = Math.pow(speed * Math.sin(angleRad), 2) / (2 * G);

      return {
        player,
        club,
        distanceYards,
        distanceMeters,
        angleDeg,
        angleRad,
        speed,
        duration,
        maxHeightYards: maxHeightMeters * METER_TO_YARD
      };
    }

    function pointAt(progress) {
      const t = shot.duration * progress;
      const xMeters = shot.speed * Math.cos(shot.angleRad) * t;
      const yMeters = shot.speed * Math.sin(shot.angleRad) * t - 0.5 * G * t * t;
      return {
        x: Math.min(shot.distanceYards, Math.max(0, xMeters * METER_TO_YARD)),
        y: Math.max(0, yMeters * METER_TO_YARD),
        time: t
      };
    }

    function playLaunchSound() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;

      audioContext ||= new AudioCtx();
      const now = audioContext.currentTime;
      const master = audioContext.createGain();
      master.gain.setValueAtTime(0.0001, now);
      master.gain.exponentialRampToValueAtTime(0.42, now + 0.006);
      master.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
      master.connect(audioContext.destination);

      const click = audioContext.createOscillator();
      const clickGain = audioContext.createGain();
      click.type = "triangle";
      click.frequency.setValueAtTime(1320, now);
      click.frequency.exponentialRampToValueAtTime(420, now + 0.12);
      clickGain.gain.setValueAtTime(0.95, now);
      clickGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
      click.connect(clickGain);
      clickGain.connect(master);
      click.start(now);
      click.stop(now + 0.18);

      const bufferSize = Math.floor(audioContext.sampleRate * 0.08);
      const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i += 1) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2.4);
      }
      const noise = audioContext.createBufferSource();
      const filter = audioContext.createBiquadFilter();
      const noiseGain = audioContext.createGain();
      noise.buffer = buffer;
      filter.type = "highpass";
      filter.frequency.setValueAtTime(1800, now);
      noiseGain.gain.setValueAtTime(0.34, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
      noise.connect(filter);
      filter.connect(noiseGain);
      noiseGain.connect(master);
      noise.start(now);
      noise.stop(now + 0.08);
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.round(rect.width * ratio);
      canvas.height = Math.round(rect.height * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      return rect;
    }

    function getScale(rect) {
      const maxX = Math.ceil((shot.distanceYards * 1.12) / 50) * 50;
      const maxY = Math.max(60, Math.ceil((shot.maxHeightYards * 1.45) / 25) * 25);
      const origin = { x: 52, y: rect.height - 68 };
      const xScale = (rect.width - origin.x - 38) / maxX;
      const yScale = (origin.y - 30) / maxY;
      return { origin, maxX, maxY, scale: Math.min(xScale, yScale) };
    }

    function drawGrid(rect, origin, scale, maxX, maxY) {
      ctx.clearRect(0, 0, rect.width, rect.height);

      const sky = ctx.createLinearGradient(0, 0, 0, rect.height);
      sky.addColorStop(0, "#e7f5ff");
      sky.addColorStop(0.58, "#f9fcf8");
      sky.addColorStop(1, "#dcefd8");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, rect.width, rect.height);

      ctx.fillStyle = "rgba(45, 139, 87, 0.16)";
      ctx.fillRect(origin.x, origin.y, rect.width - origin.x - 26, 20);

      ctx.strokeStyle = "rgba(87, 113, 96, 0.2)";
      ctx.lineWidth = 1;
      ctx.font = "12px Arial";
      ctx.fillStyle = "#5d6c63";

      const xStep = maxX > 280 ? 50 : 25;
      for (let x = 0; x <= maxX; x += xStep) {
        const px = origin.x + x * scale;
        ctx.beginPath();
        ctx.moveTo(px, 24);
        ctx.lineTo(px, origin.y);
        ctx.stroke();
        ctx.fillText(String(x), px - 8, origin.y + 22);
      }

      const yStep = maxY > 120 ? 25 : 10;
      for (let y = 0; y <= maxY; y += yStep) {
        const py = origin.y - y * scale;
        ctx.beginPath();
        ctx.moveTo(origin.x, py);
        ctx.lineTo(rect.width - 24, py);
        ctx.stroke();
        if (y > 0) ctx.fillText(String(y), 12, py + 4);
      }

      ctx.strokeStyle = "#26362c";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(origin.x, 24);
      ctx.lineTo(origin.x, origin.y);
      ctx.lineTo(rect.width - 24, origin.y);
      ctx.stroke();

      ctx.fillStyle = "#26362c";
      ctx.font = "700 13px Arial";
      ctx.fillText("y 高度 (yd)", 12, 20);
      ctx.fillText("x 距离 (yd)", rect.width - 102, origin.y + 42);
    }

    function screenPoint(point, origin, scale) {
      return {
        x: origin.x + point.x * scale,
        y: origin.y - point.y * scale
      };
    }

    function drawTrace(origin, scale) {
      if (trail.length < 2) return;
      ctx.save();
      ctx.strokeStyle = "rgba(36, 120, 183, 0.78)";
      ctx.lineWidth = 4;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      trail.forEach((point, index) => {
        const p = screenPoint(point, origin, scale);
        if (index === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      });
      ctx.stroke();
      ctx.restore();
    }

    function drawLanding(origin, scale) {
      if (!landed) return;
      const p = screenPoint({ x: shot.distanceYards, y: 0 }, origin, scale);
      ctx.save();
      ctx.strokeStyle = "rgba(216, 115, 50, 0.46)";
      ctx.fillStyle = "rgba(216, 115, 50, 0.14)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 17, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#d87332";
      ctx.beginPath();
      ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#1d2a22";
      ctx.font = "700 14px Arial";
      ctx.fillText(`${shot.distanceYards} yd`, Math.min(p.x - 28, canvas.clientWidth - 86), p.y - 20);
      ctx.restore();
    }

    function drawGolfBall(px, py, radius, spin) {
      ctx.save();
      const shadow = Math.max(0.15, Math.min(1, 1 - ballPosition.y / 90));
      ctx.fillStyle = `rgba(0, 0, 0, ${0.18 * shadow})`;
      ctx.beginPath();
      ctx.ellipse(px, canvas.clientHeight - 68, radius * (1.2 - shadow * 0.25), radius * 0.28, 0, 0, Math.PI * 2);
      ctx.fill();

      const gradient = ctx.createRadialGradient(px - radius * 0.35, py - radius * 0.4, radius * 0.2, px, py, radius);
      gradient.addColorStop(0, "#ffffff");
      gradient.addColorStop(0.64, "#eef2ee");
      gradient.addColorStop(1, "#b8c3bd");
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(px, py, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(88, 104, 94, 0.34)";
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.fillStyle = "rgba(120, 135, 126, 0.34)";
      for (let i = 0; i < 9; i += 1) {
        const angle = spin + i * 0.72;
        const dx = Math.cos(angle) * radius * 0.52;
        const dy = Math.sin(angle * 1.3) * radius * 0.42;
        ctx.beginPath();
        ctx.arc(px + dx, py + dy, Math.max(1, radius * 0.11), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawScene() {
      if (!shot) shot = getShot();
      const rect = resizeCanvas();
      const { origin, maxX, maxY, scale } = getScale(rect);

      drawGrid(rect, origin, scale, maxX, maxY);
      drawTrace(origin, scale);
      drawLanding(origin, scale);

      const ballScreen = screenPoint(ballPosition, origin, scale);
      drawGolfBall(ballScreen.x, ballScreen.y, 8, flightProgress * 18);
    }

    function updateText(message) {
      fields.angle.textContent = `${shot.angleDeg}°`;
      fields.distance.textContent = `${shot.distanceYards} yd`;
      fields.liveDistance.textContent = `${Math.round(ballPosition.x)} yd`;
      fields.speed.textContent = `${shot.speed.toFixed(1)} m/s`;
      fields.time.textContent = `${ballPosition.time ? ballPosition.time.toFixed(1) : "0.0"} s`;
      fields.message.textContent = message;
      fields.message.classList.toggle("land", landed);

      fields.chips.innerHTML = "";
      players[shot.player].forEach(([club, distance]) => {
        const chip = document.createElement("span");
        chip.className = club === shot.club ? "chip active" : "chip";
        chip.textContent = `${club} ${distance}`;
        fields.chips.appendChild(chip);
      });
    }

    function resetShot(message) {
      if (animation) cancelAnimationFrame(animation);
      shot = getShot();
      trail = [];
      ballPosition = { x: 0, y: 0, time: 0 };
      landed = false;
      flightProgress = 0;
      launchBtn.disabled = false;
      launchBtn.innerHTML = '<span class="ball-dot" aria-hidden="true"></span>发射';
      updateText(message);
      drawScene();
    }

    function launch() {
      if (animation) cancelAnimationFrame(animation);
      playLaunchSound();
      shot = getShot();
      trail = [];
      ballPosition = { x: 0, y: 0, time: 0 };
      landed = false;
      flightProgress = 0;
      launchBtn.disabled = true;
      launchBtn.innerHTML = '<span class="ball-dot" aria-hidden="true"></span>飞行中';

      const swingMs = 520;
      const flightMs = Math.max(1600, Math.min(4300, shot.duration * 620));
      const started = performance.now();

      function frame(now) {
        const elapsed = now - started;
        if (elapsed < swingMs) {
          updateText("准备发射小球。");
          drawScene();
          animation = requestAnimationFrame(frame);
          return;
        }

        flightProgress = Math.min(1, (elapsed - swingMs) / flightMs);
        const eased = 1 - Math.pow(1 - flightProgress, 1.22);
        ballPosition = pointAt(eased);
        trail.push({ x: ballPosition.x, y: ballPosition.y });

        if (flightProgress >= 1) {
          ballPosition = { x: shot.distanceYards, y: 0, time: shot.duration };
          trail.push(ballPosition);
          landed = true;
          launchBtn.disabled = false;
          launchBtn.innerHTML = '<span class="ball-dot" aria-hidden="true"></span>再发射';
          updateText(`${shot.player} 使用 ${shot.club}，小球飞行了 ${shot.distanceYards} yd。`);
          drawScene();
          animation = null;
          return;
        }

        updateText("小球正在飞行，轨迹会随着它向前延伸。");
        drawScene();
        animation = requestAnimationFrame(frame);
      }

      animation = requestAnimationFrame(frame);
    }

    fillPlayers();
    fillClubs();

    playerSelect.addEventListener("change", fillClubs);
    clubSelect.addEventListener("change", () => {
      angleSlider.value = defaultAngles[clubSelect.value] || 18;
      resetShot("球杆已更换，点击右下角发射查看新的轨迹。");
    });
    angleSlider.addEventListener("input", () => {
      resetShot("角度已更新，点击右下角发射查看新的轨迹。");
    });
    launchBtn.addEventListener("click", launch);
    resetBtn.addEventListener("click", () => resetShot("已重置，点击右下角发射。"));
    window.addEventListener("resize", drawScene);
  </script>
</body>
</html>
